# Entorno local parecido a la nube. No uses esto con secretos reales en un repo público.
#
#   cp .env.example .env   # completa valores
#   docker compose up --build
#
# Frontend: http://localhost:8088
# Backend:  http://localhost:8080/actuator/health

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: puro_norte
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-localdev}
    ports:
      - "3307:3306"
    volumes:
      - puro_norte_mysql:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-localdev}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://db:3306/puro_norte?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-localdev}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-jwt-de-al-menos-32-chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088,http://localhost:5173}
      FACTUSMART_API_KEY: ${FACTUSMART_API_KEY:-}
      FACTUSMART_RUC: ${FACTUSMART_RUC:-}
      FACTUSMART_URL_BASE: ${FACTUSMART_URL_BASE:-https://s2.factusmart.pe/api/v1/issuer}
      # En compose local, sin API key se permite simular. En GCP real: no definir esto.
      FACTUSMART_MODO_SIMULADO: ${FACTUSMART_MODO_SIMULADO:-true}
      APIPERU_TOKEN: ${APIPERU_TOKEN:-}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      ADMIN_USUARIO: ${ADMIN_USUARIO:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-CambiaEstaClave12}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  puro_norte_mysql:
