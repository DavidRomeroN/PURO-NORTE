server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta de React vuelve al index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache corto de assets con hash en el nombre.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
