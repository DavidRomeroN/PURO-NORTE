spring.application.name=anticucheria-backend
server.port=${SERVER_PORT:8080}

# Sin perfil indicado se asume desarrollo. En el servidor hay que definir
# SPRING_PROFILES_ACTIVE=prod: es lo que obliga a tener API key de FactuSmart.
spring.profiles.default=dev

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/puro_norte?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA + Flyway
# El schema lo aplica Flyway (db/migration). Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Si la BD ya tiene tablas (instalación vieja) y no hay historial de Flyway, marca
# la versión actual sin volver a crear nada. En BD vacía corre V1 normalmente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT
# Sin valor por defecto a proposito: una clave de firma escrita aca la puede leer
# cualquiera que vea el repositorio, y con ella se firma un token de administrador.
# En dev se genera una al azar (ver application-dev.properties); en prod es obligatoria.
jwt.secret=${JWT_SECRET:}
jwt.secreto-efimero=false
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# FactuSmart
# Cada emision real cuesta 1 credito, tambien en sandbox, y solo hay 100.
# El modo simulado se activa en application-dev.properties; en prod queda apagado y
# entonces una API key vacia impide arrancar.
factusmart.modo-simulado=false
# Ya incluye el prefijo /api/v1/issuer, asi que las rutas del cliente son /documents,
# /account y /ping.
factusmart.url-base=${FACTUSMART_URL_BASE:https://s2.factusmart.pe/api/v1/issuer}
# Sin valor por defecto: si va en el archivo cualquiera con el repo puede emitir boletas.
factusmart.api-key=${FACTUSMART_API_KEY:}
factusmart.ruc=${FACTUSMART_RUC:}
factusmart.timeout-ms=30000
factusmart.igv-porcentaje=18
# Cambiar a true solo si la prueba en sandbox del item de S/6.00 muestra descuadre
# de centimos: calcula el IGV por resta para que el total cuadre exacto (Parte 3.3).
factusmart.igv-por-resta=false

# Verificacion de DNI en la caja
# FactuSmart no consulta documentos, solo emite comprobantes, asi que esto va contra un
# proveedor aparte con su propio saldo. Sin APIPERU_TOKEN no se consulta nada: la caja
# avisa que no pudo verificar y la boleta se emite igual.
consulta-dni.url=${CONSULTA_DNI_URL:https://apiperu.dev/api/dni}
consulta-dni.token=${APIPERU_TOKEN:}
consulta-dni.timeout-ms=5000

# Seed inicial
# En prod va apagado. Primer arranque en la nube: SEED_ENABLED=true + ADMIN_PASSWORD
# fuerte (>=12 chars); luego apagar el seed.
app.seed.enabled=${SEED_ENABLED:true}
app.seed.catalogo=${SEED_CATALOGO:true}
app.seed.admin=${SEED_ADMIN:true}
app.seed.admin-usuario=${ADMIN_USUARIO:admin}
app.seed.admin-password=${ADMIN_PASSWORD:}

# URL pública del API (enlaces de boleta al cliente). En Cloud Run: https://....run.app
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
app.boleta.token-dias-vigencia=${BOLETA_TOKEN_DIAS:30}

# Correo (opcional). Si defines MAIL_HOST, Boot crea JavaMailSender.
# Ejemplo: MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_USERNAME=... MAIL_PASSWORD=... MAIL_ENABLED=true
app.mail.from=${MAIL_FROM:}
app.mail.enabled=${MAIL_ENABLED:false}

# Parrilla: minutos sin despachar para resaltar la tarjeta
app.parrilla.alerta-minutos=${PARRILLA_ALERTA_MINUTOS:15}

# Actuator: solo health/info públicos (ver SecurityConfig)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.main.allow-bean-definition-overriding=false
