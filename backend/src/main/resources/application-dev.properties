# Perfil de desarrollo. Activo por defecto (spring.profiles.default=dev).

# Sin FACTUSMART_API_KEY se simulan las boletas (simulada=true, sin validez fiscal).
factusmart.modo-simulado=true

# Sin JWT_SECRET se genera una clave al azar en cada arranque.
jwt.secreto-efimero=true

# Contraseña solo para local. Nunca uses esta en el servidor.
app.seed.enabled=true
app.seed.admin-password=${ADMIN_PASSWORD:admin123-local}
