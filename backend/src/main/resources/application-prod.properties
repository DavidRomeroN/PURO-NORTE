# Perfil de produccion. Activarlo con SPRING_PROFILES_ACTIVE=prod.

# Sin modo simulado y con FACTUSMART_API_KEY vacia, la aplicacion no arranca.
factusmart.modo-simulado=false

# Sin JWT_SECRET la aplicacion no arranca.
jwt.secreto-efimero=false

# No loguear cada venta en texto plano.
spring.jpa.show-sql=false

# El seed no corre solo. El primer arranque puede activarlo una vez:
# SEED_ENABLED=true ADMIN_PASSWORD='contraseña-larga-unica'
# y luego quitar esas variables.
app.seed.enabled=${SEED_ENABLED:false}

# JDBC de produccion: la URL completa viene de DB_URL (Cloud SQL con SSL o socket).
# Ejemplo IP privada:
#   jdbc:mysql://10.x.x.x:3306/puro_norte?useSSL=true&requireSSL=true&serverTimezone=America/Lima&characterEncoding=UTF-8
# Ejemplo Cloud SQL socket (Cloud Run):
#   jdbc:mysql:///puro_norte?cloudSqlInstance=PROYECTO:REGION:INSTANCIA&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
